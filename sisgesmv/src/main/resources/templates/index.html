<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Home - Sistema De Gerencimento</title>

    <!-- Importação do Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    
    <!-- CSS personalizado -->
    <link rel="stylesheet" th:href="@{/css/home.css}">
</head>
<body>

    <div class="home-container container-fluid vh-100 d-flex align-items-center justify-content-center">
