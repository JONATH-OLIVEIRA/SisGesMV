<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard do Administrador</title>

<!-- Bootstrap CSS -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet">

<link rel="stylesheet" href="styles.css">
</head>
<body>

	<!-- Barra de navegação -->
	<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
		<div class="container-fluid">
			<a class="navbar-brand" href="">Admin Dashboard</a>
			
			<button class="navbar-toggler" type="button"
				data-bs-toggle="collapse" data-bs-target="#navbarNav">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="navbarNav">
				<ul class="navbar-nav ms-auto">
					<li class="nav-item"><a class="nav-link"
						href="/admin/gerenciar-usuarios">Gerenciar Usuários</a></li>
					<li class="nav-item"><a class="nav-link"
						href="/admin/gerenciar-produtos">Gerenciar Produtos</a></li>
					<li class="nav-item"><a class="nav-link"
						href="/admin/gerenciar-pedidos">Gerenciar Pedidos</a></li>
					<li class="nav-item"><a class="nav-link text-warning"
						href="/admin/adminPerfil">Meu Perfil</a></li>
				</ul>
				<div class="d-flex">
				<button class="btn btn-outline-light"
					onclick="localStorage.removeItem('token'); window.location.href='/';">Sair</button>
			</div>
			</div>
		</div>
	</nav>

	<!-- Conteúdo Principal -->

	<h2>
		Bem-vindo, <span id="nome"></span>!
	</h2>
	<p class="lead">Gerencie os usuários do sistema abaixo.</p>

	<script src="/js/adminDashboard.js"></script>

	<!-- Bootstrap JS -->
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
