<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gerenciar Usuários</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="/admin/dashboard">Admin Dashboard</a>
        <div class="d-flex">
            <button class="btn btn-outline-light" onclick="localStorage.removeItem('token'); window.location.href='/login';">Logout</button>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h2>Gerenciar Usuários</h2>

    <!-- Formulário de Cadastro -->
    <div class="card p-4 mt-3">
        <h4>Cadastrar Novo Usuário</h4>
        <form id="cadastroUsuarioForm">
            <div class="mb-3">
                <label class="form-label">Nome:</label>
                <input type="text" class="form-control" id="nome" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Email:</label>
                <input type="email" class="form-control" id="email" required>
            </div>
            <div class="mb-3">
                <label class="form-label">CPF:</label>
                <input type="text" class="form-control" id="cpf" pattern="\d{11}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Data de Nascimento:</label>
                <input type="date" class="form-control" id="dtNascimento" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Senha:</label>
                <input type="password" class="form-control" id="senha" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Tipo de Usuário:</label>
                <select class="form-control" id="tipoUsuario" required>
                    <option value="USER">Usuário Comum</option>
                    <option value="ADMIN">Administrador</option>
                </select>
            </div>
            <button type="submit" class="btn btn-success">Criar Usuário</button>
        </form>
    </div>

    <!-- Listagem de Usuários -->
    <div class="mt-4">
        <h4>Lista de Usuários</h4>
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Email</th>
                    <th>CPF</th>
                    <th>Data de Nascimento</th>
                    <th>Tipo</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabelaUsuarios">
                <!-- Populado via JavaScript -->
            </tbody>
        </table>
    </div>
</div>

<script src="/js/gerenciarUsuarios.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
