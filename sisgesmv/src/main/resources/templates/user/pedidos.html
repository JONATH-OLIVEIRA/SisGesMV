<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Pedidos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .product-row.selected {
            background-color: #e6f7ff;
        }
        #resumoPedido {
            max-height: 300px;
            overflow-y: auto;
        }
        .total-pedido {
            font-weight: bold;
            font-size: 1.2em;
            color: #0d6efd;
        }
    </style>
</head>
<body class="bg-light">
    <div class="container py-4">
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">Sistema de Pedidos</a>
            </div>
        </nav>

        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h2 class="mb-0">Seleção de Produtos</h2>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover" id="tabelaProdutos">
                        <thead class="table-dark">
                            <tr>
                                <th>Selecionar</th>
                                <th>Nome</th>
                                <th>Preço Unitário</th>
                                <th>Estoque</th>
                                <th>Quantidade</th>
                                <th>Subtotal</th>
                            </tr>
                        </thead>
                        <tbody id="listaProdutos">
                            <!-- Produtos serão carregados via JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="card shadow mt-4">
            <div class="card-header bg-success text-white">
                <h3 class="mb-0">Resumo do Pedido</h3>
            </div>
            <div class="card-body">
                <div id="resumoPedido" class="mb-3"></div>
                <div class="d-flex justify-content-between align-items-center">
                    <h4 class="total-pedido">Total: R$ 0,00</h4>
                    <button id="finalizarPedido" class="btn btn-primary btn-lg">Enviar Pedido para Aprovação</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Confirmação -->
    <div class="modal fade" id="confirmacaoModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Confirmar Pedido</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p>Deseja realmente enviar este pedido para aprovação?</p>
                    <div id="detalhesConfirmacao"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" id="confirmarEnvio" class="btn btn-primary">Confirmar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS e jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Nosso script de pedidos -->
    <script src="/js/pedidos.js"></script>
</body>
</html>
