<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Meu Perfil</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/user/dashboard">User Dashboard</a>
        </div>
    </nav>

    <div class="container mt-4">
        <h2>Meu Perfil</h2>

        <form id="perfilForm">
            <div id="error-message" class="alert alert-danger d-none mb-3"></div>
            <div class="mb-3">
                <label class="form-label">Nome:</label>
                <input type="text" class="form-control" id="nome">
            </div>

            <div class="mb-3">
                <label class="form-label">Email:</label>
                <input type="email" class="form-control" id="email" disabled>
            </div>

            <div class="mb-3">
                <label class="form-label">CPF:</label>
                <input type="text" class="form-control" id="cpf" disabled>
            </div>

            <div class="mb-3">
                <label class="form-label">Data de Nascimento:</label>
                <input type="date" class="form-control" id="dtNascimento">
            </div>

            <div class="mb-3">
                <label class="form-label">Tipo de Usuário:</label>
                <input type="text" class="form-control" id="tipoUsuarioDisplay" disabled>
            </div>

            <div class="mb-3">
                <label class="form-label">Nova Senha:</label>
                <input type="password" class="form-control" id="senha">
            </div>

            <button type="submit" class="btn btn-primary">Salvar Alterações</button>
            <button type="button" class="btn btn-danger" id="excluirContaBtn">Excluir Conta</button>
            <button id="voltarBtn" type="button" class="btn btn-warning">Voltar</button>
        </form>
        
    <script src="/js/userPerfil.js"></script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

   
</body>
</html>
